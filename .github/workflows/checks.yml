name: Validate kit
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tools/ads_checks.py audit examples/inputs/keywords.csv
      - run: python tools/ads_checks.py pacing examples/inputs/budget-plan.csv --as-of 2026-11-06
      - run: python tools/ads_checks.py rsa examples/outputs/04-rsa-assets.csv
